name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts-and-aot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet run --file tools/Verify.cs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-matrix-and-coverage-${{ matrix.os }}
          path: |
            artifacts/test-results/
            artifacts/test-matrix-summary.json
            docs/contracts/test-coverage.md
  keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - run: dotnet run --file tools/Test-Integration.cs
      - run: dotnet run --file tools/Test-Integration.cs -- --native-aot
