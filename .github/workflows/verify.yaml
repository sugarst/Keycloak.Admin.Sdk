name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts-and-aot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet run --file tools/Verify.cs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-matrix-and-coverage-${{ matrix.os }}
          path: |
            artifacts/test-results/
            !artifacts/test-results/**/packages/**
            artifacts/test-matrix-summary.json
            docs/contracts/test-coverage.md
            docs/contracts/protocol-coverage.md
            docs/contracts/platform-coverage.md
            docs/contracts/hosting-coverage.md
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        route: [fgap-v2-stable, fgap-v1-compat]
    env:
      KEYCLOAK_ADMIN_API_ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet run --file local/keycloak/Service.cs -- test-full
      - run: dotnet run --file local/keycloak/Service.cs -- test-full-native
      - if: matrix.route == 'fgap-v2-stable'
        run: dotnet run --file tools/Check-FullAcceptance.cs -- --v2
      - if: matrix.route == 'fgap-v1-compat'
        run: dotnet run --file tools/Check-FullAcceptance.cs -- --v1
      - if: matrix.route == 'fgap-v2-stable'
        run: dotnet run --file tools/Test-AcceptanceGate.cs -- --v2
      - if: matrix.route == 'fgap-v1-compat'
        run: dotnet run --file tools/Test-AcceptanceGate.cs -- --v1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-business-acceptance-${{ matrix.route }}
          path: artifacts/full-live/
      - if: always()
        run: dotnet run --file local/keycloak/Service.cs -- down
  application-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet run --file tools/Test-ApplicationProtocols.cs
      - run: dotnet run --file tools/Test-ApplicationProtocols.cs -- --native-aot
      - run: dotnet run --file tools/Check-ApplicationProtocols.cs
      - run: dotnet run --file tools/Test-ApplicationProtocols.cs -- --legacy
      - run: dotnet run --file tools/Test-ApplicationProtocols.cs -- --legacy --native-aot
      - run: dotnet run --file tools/Check-ApplicationProtocols.cs -- --legacy
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: application-protocol-workflows
          path: artifacts/application-protocols/*.json
