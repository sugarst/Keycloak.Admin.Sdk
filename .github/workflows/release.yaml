name: release-candidate
on: workflow_dispatch
jobs:
  full-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --file tools/Release.cs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-target-release-candidate
          path: |
            artifacts/releases/
            artifacts/test-results/
            artifacts/full-live/
      - if: always()
        run: dotnet run --file local/keycloak/Service.cs -- down
