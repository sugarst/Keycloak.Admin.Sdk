name: keycloak-admin-sdk-local

services:
  # Optional real upstream used only by full federation acceptance.
  ldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    profiles: [acceptance]
    environment:
      LDAP_ORGANISATION: SDK acceptance
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?Initialize with Service.cs first}
      LDAP_TLS: "false"
    ports:
      - "127.0.0.1:1389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1 -D cn=admin,dc=example,dc=org -w \"$$LDAP_ADMIN_PASSWORD\" -b dc=example,dc=org -s base dn >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:18.0-alpine3.22
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialize with Service.cs first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker inside this parent mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-keycloak}", "-d", "${POSTGRES_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    pull_policy: missing
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Initialize with Service.cs first}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Initialize with Service.cs first}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_FEATURES: ${KEYCLOAK_FEATURES:-admin-fine-grained-authz:v2}
    labels:
      io.keycloak-admin-sdk.route: ${KEYCLOAK_ADMIN_API_ROUTE:-fgap-v2-stable}
      io.keycloak-admin-sdk.release: "26.8.1"
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-19000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    # The image has no HTTP CLI. Service.cs waits on /health/ready via .NET HttpClient.

volumes:
  postgres_data:
